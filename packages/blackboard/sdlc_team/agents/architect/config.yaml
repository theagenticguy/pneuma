spec_version: 1

name: architect

description: >-
  Owns system design as a bounded context: produces an architecture-decision artifact
  (component boundaries, data flow, interface contracts, trade-offs) and reviews
  implementation revisions against the design it authored.

executor:
  type: omnigent
  model: global.anthropic.claude-opus-4-8
  config:
    harness: claude-sdk

prompt: |
  Execute exactly one supplied task contract in the architecture bounded context.

  As a PRODUCER (design task): retrieve the goal snapshot and any accepted analysis
  artifact, then publish an architecture-decision record — component boundaries,
  dependency direction, interface/data contracts, chosen approach with the strongest
  rejected alternative, and the invariants downstream implementation must preserve.

  As a REVIEWER (architecture-review task): inspect the exact implementation revision
  in the contract and check it against the design contracts and invariants. Open a
  blocking finding for any boundary violation or contract drift; otherwise submit an
  approving, revision-bound review.

  Do not implement. Start a runtime run before substantive work; the blackboard result
  is authoritative, your chat message is a summary.

async: true
cancellable: true

os_env:
  type: caller_process
  cwd: .
  sandbox:
    write_paths:
      - ./artifacts/architect
    allow_network: false

tools:
  blackboard:
    type: mcp
    url: http://127.0.0.1:8010/mcp
    tools:
      - get_task_contract
      - get_goal_snapshot
      - get_artifact_revision
      - read_relevant_events
      - start_runtime_run
      - open_finding
      - submit_review
      - submit_task_result

  # Bonk's unified MCP gateway (mcp-gateway repo, supervisord-managed on this
  # host at 127.0.0.1:9400). Read-only research surface only. Tools are the
  # gateway's namespaced {server}_{tool} names; the allow-list filters at
  # registration so only these reach the model. Boot order: the gateway must be
  # up (mcp-gateway `mise run gw-start`) before `mise run team`, same as :8010.
  # Host `~/.claude/settings.json` MCP servers do NOT flow into claude-sdk
  # agents — external tools must be declared here explicitly (verified against
  # omnigent 0.5.1 claude_sdk_executor: only YAML `type: mcp` blocks bridge in).
  gateway:
    type: mcp
    url: http://127.0.0.1:9400/mcp/
    tools:
      - context7_resolve-library-id
      - context7_query-docs
      - awsknowledge_aws___read_documentation
      - awsknowledge_aws___search_documentation
      - awsknowledge_aws___list_regions
      - awsknowledge_aws___get_regional_availability
      - awsknowledge_aws___retrieve_skill
      - brave-search_brave_web_search
      - brave-search_brave_news_search
      - brave-search_brave_summarizer
      - exa_web_search_exa
      - exa_web_fetch_exa
      - tavily_tavily_search
      - tavily_tavily_extract
      - tavily_tavily_research

# Role-curated host-skill filter (top-level `skills:` -> AgentSpec.
# skills_filter). Scopes which host/plugin skills are PRE-APPROVED to
# invoke; all remain discoverable (setting_sources stays user,project).
skills:
  - personal-plugins:product-strategy
  - personal-plugins:tech-stack-builder
  - personal-plugins:diagrams
  - personal-plugins:comprehensive-codebase-understanding
