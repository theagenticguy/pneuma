# The workspace root is a virtual root: it declares members and nothing else.
# It has no [project] table on purpose, so there is no "pneuma-monorepo" distribution
# to accidentally publish and no shared dependency set that would let one member drift
# into using another's dev tooling without declaring it.
#
# Each member keeps its own dependencies, dev group, pytest config, and ruff config, so
# `packages/pneuma` and `packages/blackboard` stay independently publishable and their
# styles stay separate (the blackboard lints under a stricter select list). `uv sync` here
# materializes ONE .venv that serves both members, editable.
[tool.uv.workspace]
members = ["packages/*"]
