\* Guard-must-fire for NoIllegalTransition: a ready -> submitted step, an edge the
\* POC's transition matrix does not have. Legal() is untouched, so the check is
\* genuinely against the matrix rather than against the actions.
\*
\* TLC is EXPECTED to report a temporal-property violation. NoIllegalTransition is an
\* action property -- a single state cannot witness an edge.
SPECIFICATION Spec

CONSTANTS
    Runs         = {r1, r2}
    Branches     = {b1, b2}
    Decisions    = {d1, d2}
    Reviewers    = {v1, v2}
    MaxConflicts = 1
    MaxRework    = 1
    MaxBlocks    = 1
    MaxWaits     = 1
    GateSkipsConflicts  = FALSE
    GateSkipsSplitBrain = FALSE
    GateSkipsReviews    = FALSE
    UnfencedStart       = FALSE
    IllegalShortcut     = TRUE
    BankReviews         = FALSE
    LeakRun             = FALSE
    AcceptWithoutReviews= FALSE
    WaiverOverrides     = FALSE

PROPERTY NoIllegalTransition
