\* Guard-must-fire for WaiverCannotMaskDivergence: the waiver stops being scoped to the
\* empty case and becomes a blanket clean verdict, so a team that waived once can then
\* diverge freely and still read clean.
\*
\* This is the defect the waiver path could plausibly have introduced -- an escape hatch
\* from a strict gate is exactly the shape a silent accept comes back in -- so the
\* mechanism added to satisfy XPL-1/XPL-2 gets its own guard-must-fire evidence rather
\* than being trusted because its intent was good.
\*
\* TLC is EXPECTED to report WaiverCannotMaskDivergence violated.
SPECIFICATION Spec

CONSTANTS
    Runs         = {r1, r2}
    Branches     = {b1, b2}
    Decisions    = {d1, d2}
    Reviewers    = {v1, v2}
    MaxConflicts = 1
    MaxRework    = 1
    MaxBlocks    = 1
    MaxWaits     = 1
    GateSkipsConflicts  = FALSE
    GateSkipsSplitBrain = FALSE
    GateSkipsReviews    = FALSE
    UnfencedStart       = FALSE
    IllegalShortcut     = FALSE
    BankReviews         = FALSE
    LeakRun             = FALSE
    AcceptWithoutReviews= FALSE
    WaiverOverrides     = TRUE

INVARIANT WaiverCannotMaskDivergence
