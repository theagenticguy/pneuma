\* The REJECTED design: per-hook loops without the restart. Identical to
\* AnswerLoop.cfg except RestartOnRevise = FALSE, which makes Revise's `i' = i`
\* instead of `i' = 1` -- the walk never goes back to a hook it already passed.
\*
\* TLC is EXPECTED to report NoUnreviewedShip violated. That counterexample is the
\* whole justification for the restart chain and is transcribed in README.md.
\*
\* K = 2 rather than 3: the defect needs only two hooks and the shortest trace is
\* the readable one. MaxCap = 1 for the same reason.
SPECIFICATION Spec

CONSTANTS
    K               = 2
    MaxCap          = 1
    RestartOnRevise = FALSE

INVARIANT NoUnreviewedShip
