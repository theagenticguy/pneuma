\* Safety: the transition matrix, the fence, and the cross-plane release gate.
\*
\* Two run slots, so a second claim is possible and the fence has something to
\* refuse. Two branches and two answers, the minimum for split_brain to distinguish
\* UNSETTLED / NONE / CONFIRMED. Two required reviews. Every loop bounded at 1
\* round trip -- the exhaustive space is already ~1.4M states at these numbers.
SPECIFICATION Spec

CONSTANTS
    Runs         = {r1, r2}
    Branches     = {b1, b2}
    Decisions    = {d1, d2}
    Reviewers    = {v1, v2}
    MaxConflicts = 1
    MaxRework    = 1
    MaxBlocks    = 1
    MaxWaits     = 1

INVARIANT TypeOK
INVARIANT FencedAssignment
INVARIANT RunningHasOneRun
INVARIANT ReviewsNotBanked
INVARIANT NoReleaseOnAbsentEvidence
INVARIANT WaiverCannotMaskDivergence

PROPERTY NoIllegalTransition
PROPERTY GateSoundness
