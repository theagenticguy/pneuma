\* Guard-must-fire for NoLostWrite: last-writer-wins. A stale proposal is forced
\* onto main's head with no conflict row, so the head it displaced becomes reachable
\* from nothing -- the lost write in exact form.
\*
\* TLC is EXPECTED to report NoLostWrite violated. ConflictNotOverwrite is named too
\* because the same defect breaks its second clause (an attempt that did not land
\* and was not written down); whichever TLC reaches first is reported.
SPECIFICATION Spec

CONSTANTS
    Members = {m1, m2}
    Lead    = lead
    Origin  = origin
    NoOne   = noone
    MaxRev  = 5
    MemberCommits = FALSE
    ForceCommit   = TRUE
    AutoMerge     = FALSE
    RewriteAuthor = FALSE

INVARIANT NoLostWrite
