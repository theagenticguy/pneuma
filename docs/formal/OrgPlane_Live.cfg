\* Liveness: "a task with a fair lead and fair reviewers eventually reaches a
\* terminal state".
\*
\* Fairness is WF_vars(TaskStep) -- the task's own steps, not Next. Fairness on Next
\* would be satisfied by a content plane churning conflict rows forever while the
\* task never moves, and Termination would then fail for a reason that is about the
\* content plane rather than about the task.
\*
\* This is the one place the bounds on rework, blocking and waiting are load-bearing
\* rather than merely economical: the kernel's matrix permits all three to cycle
\* forever, and an unbounded model would refute Termination correctly.
SPECIFICATION SpecFair

CONSTANTS
    Runs         = {r1, r2}
    Branches     = {b1, b2}
    Decisions    = {d1, d2}
    Reviewers    = {v1, v2}
    MaxConflicts = 1
    MaxRework    = 1
    MaxBlocks    = 1
    MaxWaits     = 1

PROPERTY Termination
