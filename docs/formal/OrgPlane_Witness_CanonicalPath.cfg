\* Non-vacuity witness 5 of 5 for OrgPlane, and the companion to
\* OrgPlane_Witness_Completes.cfg.
\*
\* TLC is EXPECTED to violate NeverCompletesTheCanonicalWay. With `blocks = 0` in the
\* predicate no shortcut through `blocked` qualifies, so the counterexample can only
\* be the real lifecycle: draft -> ready -> assigned -> running -> submitted ->
\* under_review -> accepted -> completed.
\*
\* It needs its own witness because `blocked` is reachable from every non-terminal and
\* returns to five states, so the edge set admits draft -> blocked -> under_review ->
\* accepted -> completed -- a task at the release gate that never ran. Every such
\* shortcut is shorter than the real chain, so BFS reports one of them for
\* NeverCompletes and the join to the execution plane would go unwitnessed.
SPECIFICATION Spec

CONSTANTS
    Runs         = {r1, r2}
    Branches     = {b1, b2}
    Decisions    = {d1, d2}
    Reviewers    = {v1, v2}
    MaxConflicts = 1
    MaxRework    = 1
    MaxBlocks    = 1
    MaxWaits     = 1

INVARIANT NeverCompletesTheCanonicalWay
