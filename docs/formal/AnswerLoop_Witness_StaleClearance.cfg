\* Non-vacuity witness 2 of 3 for AnswerLoop, and the one that matters most.
\*
\* TLC is EXPECTED to violate NoStaleClearanceEverExists. The counterexample shows
\* the DANGEROUS state -- a hook holding a clearance for an answer version that is no
\* longer the answer in hand -- is reachable in the SHIPPED design too.
\*
\* That is the point. NoUnreviewedShip does not hold because stale clearances never
\* arise; it holds because the restart chain refuses to SHIP from that state and
\* re-consults the hook instead. Without this witness, NoUnreviewedShip could have
\* been passing for entirely the wrong reason.
SPECIFICATION Spec

CONSTANTS
    K               = 3
    MaxCap          = 2
    RestartOnRevise = TRUE

INVARIANT NoStaleClearanceEverExists
