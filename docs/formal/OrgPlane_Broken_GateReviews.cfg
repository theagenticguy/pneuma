\* Guard-must-fire for GateSoundness, review conjunct -- and the one case that needed
\* TWO defects, which is a finding rather than a workaround.
\*
\* The reviews are guarded TWICE -- once by `Accepted`, which will not leave
\* under_review without a full set, and once by the gate itself. Either guard alone
\* is sufficient, measured both ways:
\*
\*   GateSkipsReviews only     23,362 distinct states, NO violation
\*   AcceptWithoutReviews only 34,306 distinct states, NO violation
\*   both (this config)           887 distinct states, GateSoundness violated
\*
\* So the guard-must-fire evidence for the gate's review conjunct requires knocking
\* out its shadow as well. That is a fact about the design's redundancy, not a hole in
\* the harness -- and it is worth knowing which guard is doing the work in the base
\* model: `Accepted`'s, because it sits earlier.
\*
\* TLC is EXPECTED to report a temporal-property violation.
SPECIFICATION Spec

CONSTANTS
    Runs         = {r1, r2}
    Branches     = {b1, b2}
    Decisions    = {d1, d2}
    Reviewers    = {v1, v2}
    MaxConflicts = 1
    MaxRework    = 1
    MaxBlocks    = 1
    MaxWaits     = 1
    GateSkipsConflicts  = FALSE
    GateSkipsSplitBrain = FALSE
    GateSkipsReviews    = TRUE
    UnfencedStart       = FALSE
    IllegalShortcut     = FALSE
    BankReviews         = FALSE
    LeakRun             = FALSE
    AcceptWithoutReviews= TRUE
    WaiverOverrides     = FALSE

PROPERTY GateSoundness
