\* Non-vacuity witness 1 of 3 for ArtifactPlane.
\*
\* TLC is EXPECTED to violate NoSiblingProposals. The counterexample is the witness
\* that ConflictNotOverwrite's sibling clause has a reachable antecedent: two
\* proposals written against one parent, both offered to the lead.
\*
\* One invariant per config on purpose -- TLC stops at the first violation, so a
\* config naming all three would only ever witness whichever it reaches first.
SPECIFICATION Spec

CONSTANTS
    Members = {m1, m2}
    Lead    = lead
    Origin  = origin
    NoOne   = noone
    MaxRev  = 5

INVARIANT NoSiblingProposals
