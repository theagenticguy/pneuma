    Runs         = {r1, r2}
    Branches     = {b1, b2}
    Decisions    = {d1, d2}
    Reviewers    = {v1, v2}
    MaxConflicts = 1
    MaxRework    = 1
    MaxBlocks    = 1
    MaxWaits     = 1
    GateSkipsConflicts  = FALSE
    GateSkipsSplitBrain = TRUE
    GateSkipsReviews    = FALSE
    UnfencedStart       = FALSE
    IllegalShortcut     = FALSE
    BankReviews         = FALSE
    LeakRun             = FALSE
    AcceptWithoutReviews= FALSE

PROPERTY GateSoundness
