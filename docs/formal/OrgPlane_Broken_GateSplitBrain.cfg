\* Guard-must-fire for GateSoundness, split-brain conjunct: the gate's `= "NONE"` relaxes
\* to the pre-resolution `# "CONFIRMED"` wording, so a task releases on a verdict the
\* probe never affirmed.
\*
\* Precisely, and measured rather than assumed: the RELEASE STEP still never fires while
\* CONFIRMED under this defect -- checked as
\* `[][(task # "completed" /\ task' = "completed") => SplitBrain # "CONFIRMED"]_vars`,
\* verified over 23,400 distinct states. Both wordings reject CONFIRMED. What this defect
\* lets through is UNSETTLED, could-not-tell, which is exactly the XPL-1/XPL-2
\* contradiction and the whole reason the polarity changed. The narrower property naming
\* that state directly is checked by OrgPlane_Broken_XPL1Regression.cfg, same defect
\* against NoReleaseOnAbsentEvidence.
\*
\* Worth stating carefully because the obvious probe for it is the wrong shape: the STATE
\* invariant `task = "completed" => SplitBrain # "CONFIRMED"` DOES fail here, but on a
\* post-release trace -- the task releases while UNSETTLED and two branches diverge
\* afterwards. That is the content plane moving on after a release, not a bad release, and
\* it is the same distinction GateSoundness is an action property for.
\*
\* TLC is EXPECTED to report a temporal-property violation.
