\* Guard-must-fire for GateSoundness, split-brain conjunct: the gate stops reading
\* `split_brain`, so an answer built on two branches that settled one design question
\* differently ships.
\*
\* TLC is EXPECTED to report a temporal-property violation.
SPECIFICATION Spec

