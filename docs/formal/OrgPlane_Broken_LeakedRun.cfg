\* Guard-must-fire for RunningHasOneRun: Submit does not retire the run, so a live
\* team run outlives the execution phase and a task sitting at `submitted` still holds
\* one. The fence would then be held by nobody.
\*
\* TLC is EXPECTED to report RunningHasOneRun violated. This is also the defect that
\* makes UnfencedStart bite -- see OrgPlane_Broken_Fence.cfg.
SPECIFICATION Spec

CONSTANTS
    Runs         = {r1, r2}
    Branches     = {b1, b2}
    Decisions    = {d1, d2}
    Reviewers    = {v1, v2}
    MaxConflicts = 1
    MaxRework    = 1
    MaxBlocks    = 1
    MaxWaits     = 1
    GateSkipsConflicts  = FALSE
    GateSkipsSplitBrain = FALSE
    GateSkipsReviews    = FALSE
    UnfencedStart       = FALSE
    IllegalShortcut     = FALSE
    BankReviews         = FALSE
    LeakRun             = TRUE
    AcceptWithoutReviews= FALSE

INVARIANT RunningHasOneRun
