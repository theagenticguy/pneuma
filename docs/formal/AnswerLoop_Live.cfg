\* Termination: the loop always ends. `WF_vars(Next)` only forbids stalling forever
\* while a move is enabled, so a reachable cycle among real actions would still
\* refute Termination -- and correctly, because such a run really never terminates.
\* The bounded-steps argument is what rules that out: every Revise increments some
\* hook's rounds, rounds are monotone (BudgetMonotone) and bounded by cap
\* (BudgetBounded), so the restarts cannot go on forever.
SPECIFICATION SpecFair

CONSTANTS
    K               = 3
    MaxCap          = 2
    RestartOnRevise = TRUE

PROPERTY Termination
