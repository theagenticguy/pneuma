\* Guard-must-fire for AuthorBound: authorship reported by the model rather than
\* bound by the wire, so an existing revision can be reassigned to another actor and
\* the lead goes to the wrong agent to resolve a collision.
\*
\* TLC is EXPECTED to report a temporal-property violation. AuthorBound is an action
\* property ([][...]_vars), so it rides as PROPERTY, not INVARIANT -- a single state
\* cannot witness a change.
SPECIFICATION Spec

CONSTANTS
    Members = {m1, m2}
    Lead    = lead
    Origin  = origin
    NoOne   = noone
    MaxRev  = 5
    MemberCommits = FALSE
    ForceCommit   = FALSE
    AutoMerge     = FALSE
    RewriteAuthor = TRUE

PROPERTY AuthorBound
