\* Guard-must-fire for ConflictNotOverwrite, both clauses at once, from the same
\* last-writer-wins defect: ForcePush puts a stale proposal into ffLanded, so two
\* siblings written against one parent both land (clause 1) and an attempt that did
\* not fast-forward legitimately is nowhere in `conflicts` (clause 2).
\*
\* TLC is EXPECTED to report ConflictNotOverwrite violated.
SPECIFICATION Spec

CONSTANTS
    Members = {m1, m2}
    Lead    = lead
    Origin  = origin
    NoOne   = noone
    MaxRev  = 5
    MemberCommits = FALSE
    ForceCommit   = TRUE
    AutoMerge     = FALSE
    RewriteAuthor = FALSE

INVARIANT ConflictNotOverwrite
