\* Safety: every invariant, over the unfair spec, so the check covers behaviors in
\* which the lead never acts as well as ones in which it does.
SPECIFICATION Spec

CONSTANTS
    Members = {m1, m2}
    Lead    = lead
    Origin  = origin
    NoOne   = noone
    MaxRev  = 5

INVARIANT TypeOK
INVARIANT NoLostWrite
INVARIANT SoleIntegrator
INVARIANT ConflictNotOverwrite
INVARIANT OverlapNeverMerges

PROPERTY AuthorBound
