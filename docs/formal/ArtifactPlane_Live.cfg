\* Liveness: no proposal pends forever. Fairness is per-proposal weak fairness on
\* the lead's four landing actions (SpecFair), and nothing else -- members are
\* deliberately unfair, because a member that never proposes again must not be what
\* makes the property hold.
\*
\* Separate from ArtifactPlane.cfg because a liveness check is a different question
\* and a much more expensive one, and because a safety violation would stop TLC
\* before it ever evaluated the temporal property (process/tla.py's rule: only a
\* clean run carries the termination claim).
SPECIFICATION SpecFair

CONSTANTS
    Members = {m1, m2}
    Lead    = lead
    Origin  = origin
    NoOne   = noone
    MaxRev  = 5

PROPERTY ProposalsSettle
