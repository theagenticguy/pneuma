\* Non-vacuity witness 2 of 4 for OrgPlane.
\*
\* TLC is EXPECTED to violate NoRunEverLive. The counterexample is the witness that
\* a run slot is genuinely claimed -- so FencedAssignment is not honoured by never
\* assigning anything, and RunningHasOneRun's first clause has an antecedent.
SPECIFICATION Spec

CONSTANTS
    Runs         = {r1, r2}
    Branches     = {b1, b2}
    Decisions    = {d1, d2}
    Reviewers    = {v1, v2}
    MaxConflicts = 1
    MaxRework    = 1
    MaxBlocks    = 1
    MaxWaits     = 1

INVARIANT NoRunEverLive
