\* Non-vacuity witness 3 of 3 for AnswerLoop.
\*
\* TLC is EXPECTED to violate NoHookEverExhausts. The counterexample is the witness
\* that a hook really does run out of budget and pass the answer through -- so
\* CapRecordedOnlyWhenExhausted, and NoUnreviewedShip's cap-exhausted disjunct, both
\* have a reachable antecedent.
SPECIFICATION Spec

CONSTANTS
    K               = 3
    MaxCap          = 2
    RestartOnRevise = TRUE

INVARIANT NoHookEverExhausts
