\* THE regression test for XPL-1/XPL-2. GateSkipsSplitBrain relaxes the gate's conjunct
\* from `= "NONE"` back to `# "CONFIRMED"` -- the exact pre-resolution wording -- and
\* nothing else changes.
\*
\* TLC is EXPECTED to report NoReleaseOnAbsentEvidence violated: a task releases while
\* `split_brain` is UNSETTLED, which is the contradiction the symspec/Z3 corpus proved
\* and main resolved in 19073a4. If this config ever comes back green, the old polarity
\* has been reintroduced somewhere and the resolution has been silently undone.
\*
\* GateSoundness is violated by the same defect (its split-brain conjunct is also
\* `= "NONE"`); this config names the narrower property because it is the one whose
\* sentence IS the finding.
SPECIFICATION Spec

CONSTANTS
    Runs         = {r1, r2}
    Branches     = {b1, b2}
    Decisions    = {d1, d2}
    Reviewers    = {v1, v2}
    MaxConflicts = 1
    MaxRework    = 1
    MaxBlocks    = 1
    MaxWaits     = 1
    GateSkipsConflicts  = FALSE
    GateSkipsSplitBrain = TRUE
    GateSkipsReviews    = FALSE
    UnfencedStart       = FALSE
    IllegalShortcut     = FALSE
    BankReviews         = FALSE
    LeakRun             = FALSE
    AcceptWithoutReviews= FALSE
    WaiverOverrides     = FALSE

INVARIANT NoReleaseOnAbsentEvidence
