\* Non-vacuity witness for the waiver path.
\*
\* TLC is EXPECTED to violate NeverCompletesOnAWaiver. The counterexample is a team that
\* recorded NO decision on any branch, waived once, and released -- the state that is
\* unreachable if the strict gate ships without the waiver.
\*
\* Measured: with RecordWaiver deleted from ContentStep,
\* `task = "completed" => Decided # {}` becomes an invariant, so such a team can only
\* abort. `Termination` still holds there (failed/cancelled are always reachable), which
\* is why the waiver's justification is stated as reachability rather than as liveness --
\* see RecordWaiver's comment.
SPECIFICATION Spec

CONSTANTS
    Runs         = {r1, r2}
    Branches     = {b1, b2}
    Decisions    = {d1, d2}
    Reviewers    = {v1, v2}
    MaxConflicts = 1
    MaxRework    = 1
    MaxBlocks    = 1
    MaxWaits     = 1

INVARIANT NeverCompletesOnAWaiver
