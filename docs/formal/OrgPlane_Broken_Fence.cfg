\* Guard-must-fire for FencedAssignment -- the second case that needed TWO defects,
\* for the same reason and with the same reading.
\*
\* UnfencedStart alone changes NOTHING: measured, 159,150 states generated / 23,362
\* distinct, no violation. `Start` fires only from `assigned`, and every path into `assigned`
\* passes through a step that retires the live run (Submit, Block, Supersede, Abort),
\* so `LiveRuns` is already empty by the time the dropped fence could matter. The
\* fence is enforced twice: once at the claim, once by the retire on the way out.
\*
\* LeakRun removes the second: Submit stops retiring the run, so a live run outlives
\* the execution phase and the unfenced Start claims a second one on top of it --
\* two team runs against one task contract, which is the one thing org-plane.md's
\* "a task contract <-> one team run" join forbids.
\*
\* TLC is EXPECTED to report FencedAssignment violated. RunningHasOneRun is broken by
\* LeakRun on its own; this config names the fence because that is the stronger claim.
SPECIFICATION Spec

CONSTANTS
    Runs         = {r1, r2}
    Branches     = {b1, b2}
    Decisions    = {d1, d2}
    Reviewers    = {v1, v2}
    MaxConflicts = 1
    MaxRework    = 1
    MaxBlocks    = 1
    MaxWaits     = 1
    GateSkipsConflicts  = FALSE
    GateSkipsSplitBrain = FALSE
    GateSkipsReviews    = FALSE
    UnfencedStart       = TRUE
    IllegalShortcut     = FALSE
    BankReviews         = FALSE
    LeakRun             = TRUE
    AcceptWithoutReviews= FALSE
    WaiverOverrides     = FALSE

INVARIANT FencedAssignment
