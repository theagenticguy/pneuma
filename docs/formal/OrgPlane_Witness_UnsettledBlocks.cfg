\* Non-vacuity witness for the XPL-1/XPL-2 resolution -- the one the coordinator asked for
\* by name, and the most important witness in this spec.
\*
\* TLC is EXPECTED to violate UnsettledNeverBlocks. The counterexample is a task with
\* every required review accepted, zero unresolved conflict rows, nothing diverging, and
\* the gate STILL SHUT -- held solely because `split_brain` could not tell: nobody
\* recorded what their change decides, and nobody waived.
\*
\* Under the old polarity (`# "CONFIRMED"`) this exact state OPENED the gate. So this
\* witness is the precise behavioural difference the resolution made, and the proof that
\* the new conjunct is load-bearing rather than a stricter spelling of the same test.
SPECIFICATION Spec

CONSTANTS
    Runs         = {r1, r2}
    Branches     = {b1, b2}
    Decisions    = {d1, d2}
    Reviewers    = {v1, v2}
    MaxConflicts = 1
    MaxRework    = 1
    MaxBlocks    = 1
    MaxWaits     = 1

INVARIANT UnsettledNeverBlocks
