\* Guard-must-fire for ReviewsNotBanked: revision_required keeps the reviews that
\* graded the answer about to be replaced. This is `_answer_loop`'s
\* accepted-then-mutated defect one plane up -- see AnswerLoop.tla, where the same
\* shape is the whole reason the restart chain exists.
\*
\* TLC is EXPECTED to report ReviewsNotBanked violated.
SPECIFICATION Spec

CONSTANTS
    Runs         = {r1, r2}
    Branches     = {b1, b2}
    Decisions    = {d1, d2}
    Reviewers    = {v1, v2}
    MaxConflicts = 1
    MaxRework    = 1
    MaxBlocks    = 1
    MaxWaits     = 1
    GateSkipsConflicts  = FALSE
    GateSkipsSplitBrain = FALSE
    GateSkipsReviews    = FALSE
    UnfencedStart       = FALSE
    IllegalShortcut     = FALSE
    BankReviews         = TRUE
    LeakRun             = FALSE
    AcceptWithoutReviews= FALSE
    WaiverOverrides     = FALSE

INVARIANT ReviewsNotBanked
