\* Guard-must-fire for GateSoundness, conflict conjunct: the gate stops reading the
\* content plane's `conflicts` table, so a task releases over an unresolved collision
\* -- exactly the cross-plane defect org-plane.md's gate exists to prevent.
\*
\* TLC is EXPECTED to report a temporal-property violation. GateSoundness is an
\* action property, so it rides as PROPERTY, not INVARIANT.
SPECIFICATION Spec

CONSTANTS
    Runs         = {r1, r2}
    Branches     = {b1, b2}
    Decisions    = {d1, d2}
    Reviewers    = {v1, v2}
    MaxConflicts = 1
    MaxRework    = 1
    MaxBlocks    = 1
    MaxWaits     = 1
    GateSkipsConflicts  = TRUE
    GateSkipsSplitBrain = FALSE
    GateSkipsReviews    = FALSE
    UnfencedStart       = FALSE
    IllegalShortcut     = FALSE
    BankReviews         = FALSE
    LeakRun             = FALSE
    AcceptWithoutReviews= FALSE

PROPERTY GateSoundness
